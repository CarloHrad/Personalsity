# Perfil de PRODUCAO (Railway). Ative com a variavel SPRING_PROFILES_ACTIVE=prod
#
# Variaveis obrigatorias no Railway:
#   JWT_SECRET                         (minimo 32 caracteres; a aplicacao nao sobe sem ela)
#   PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD   (referencie as variaveis do servico PostgreSQL)
# Variaveis para o envio do codigo de verificacao por e-mail (uma das duas formas):
#   RESEND_API_KEY + MAIL_REMETENTE    (API HTTPS: funciona em qualquer plano do Railway)
#   SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD   (SMTP: so planos
#   do Railway que liberam SMTP, hoje Pro ou superior)
# Opcional: CORS_ALLOWED_ORIGINS (nao e necessario para React Native), PORT (o Railway define sozinho)

server.port=${PORT:8089}

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# O esquema e criado pelas migrations (db/migration); o Hibernate apenas confere.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.h2.console.enabled=false

# Sem valor padrao: sem JWT_SECRET a aplicacao nao inicia.
api.security.token.secret=${JWT_SECRET}

# Autenticacao por header Authorization (sem cookies), entao "*" e aceitavel; restrinja se publicar um frontend web.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# NUNCA ligue em producao: imprimiria os codigos no log.
app.mail.log-codigo=false
app.mail.remetente=${MAIL_REMETENTE:onboarding@resend.dev}
app.mail.resend.api-key=${RESEND_API_KEY:}

logging.level.root=INFO
