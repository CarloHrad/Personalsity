server.port=${PORT:8089}

spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}

# O esquema e criado pelas migrations (db/migration); o Hibernate apenas confere.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.h2.console.enabled=false

# Sem valor padrao: sem JWT_SECRET a aplicacao nao inicia.
api.security.token.secret=${JWT_SECRET}
api.security.token.expiracao-horas=${JWT_EXPIRACAO_HORAS:168}

# Autenticacao por header Authorization (sem cookies), entao "*" e aceitavel; restrinja se publicar um frontend web.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# NUNCA ligue em producao: imprimiria os codigos no log.
app.mail.log-codigo=false
app.mail.remetente=${MAIL_REMETENTE:onboarding@resend.dev}
app.mail.resend.api-key=${RESEND_API_KEY:}

logging.level.root=INFO
